# Player Coordinates HUD localisation source.
# Generated into native TextDataBlock .assets at build time by
# utils/LocalizationGenerator.cs (shared via link.sh).
#
# Format: Namespace -> Leaf -> { hint, <iso>, <iso>, ... }
#   - hint is translator documentation; not generated.
#
# ASCII rule: never use U+2026 (real ellipsis) or U+2014 (em-dash) -- CK's PugFont
# crashes. Use '...' and '-'. German umlauts are fine.
#
# Mod Settings Menu section (Options -> Mod settings). The framework looks up each
# SETTING label by `<ModId>-Config/<key>` and the section HINT by `<ModId>-Config/_hint`.
PlayerCoordinatesHud-Config:
  _hint:
    hint: "Section hint shown under the Player Coordinates HUD heading."
    en: "Show your position and distance from the Core on the HUD."
    de: "Zeigt deine Position und die Entfernung zum Core im HUD an."
  enabled:
    hint: "Master on/off toggle label."
    en: "Enabled"
    de: "Aktiviert"
  position:
    hint: "Choice label - where on the HUD the readout is drawn."
    en: "Position"
    de: "Position"

# Choice option labels for `position`. Each leaf is the enum token
# (ModConfig.Position.<name>.ToString()), which is also what gets persisted -- renaming an enum
# member here and in the C# resets that player's choice to the default and drops its label.
PlayerCoordinatesHud-Config/position:
  BottomLeft:
    hint: "Position option - the default, and the only placement 1.0.0 had."
    en: "Bottom left"
    de: "Unten links"
  BottomRight:
    hint: "Position option."
    en: "Bottom right"
    de: "Unten rechts"
  TopLeft:
    hint: "Position option."
    en: "Top left"
    de: "Oben links"
  TopRight:
    hint: "Position option."
    en: "Top right"
    de: "Oben rechts"
  BelowMinimap:
    hint: "Position option - follows the minimap, and uses the top-right corner while the minimap is off screen."
    en: "Below minimap"
    de: "Unter der Minimap"
